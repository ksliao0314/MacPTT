[package]
name = "pttchrome-v3-tauri"
version = "1.1.0"
description = "MacPTT — a native macOS PTT BBS client"
authors = ["MacPTT"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pttchrome_v3_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
ureq = "2"
regex = "1"
aes-gcm = "0.10"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSSharingService", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSColor", "NSColorSpace"] }

[dev-dependencies]
# Extra tokio features only needed by examples/ws_smoke.rs (standalone runtime).
tokio = { version = "1", features = ["macros", "rt", "time"] }

